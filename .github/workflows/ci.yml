name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: hivemind, POSTGRES_PASSWORD: hivemind, POSTGRES_DB: hivemind }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hivemind" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://hivemind:hivemind@localhost:5432/hivemind?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Install tools
        run: |
          go install github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - name: Migrate
        run: migrate -path migrations -database "$DATABASE_URL" up
      - name: Test (race detector)
        run: go test -race ./...
      - name: Vulnerability scan
        run: govulncheck ./...

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t hivemind-api .
      - run: docker build --target worker -t hivemind-worker .
