syntax = "proto3";

package social.v1;

option go_package = "github.com/hivemind/backend/gen/social/v1;socialv1";

// AuthService — PRD §13.1 Authentication & Account, per flow.md §2.1:
// registration is Google/Apple OAuth only, no email+password. Account
// recovery (no password to reset) is a verified recovery email that lets a
// user re-link a new OAuth identity if they lose access to Google/Apple.
service AuthService {
  rpc SignInWithGoogle(OAuthSignInRequest) returns (AuthTokens);
  rpc SignInWithApple(OAuthSignInRequest) returns (AuthTokens);
  rpc RefreshToken(RefreshTokenRequest) returns (AuthTokens);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);

  // AddRecoveryEmail/VerifyRecoveryEmail: authenticated — the user attaches
  // and confirms a recovery email to their existing account.
  rpc AddRecoveryEmail(AddRecoveryEmailRequest) returns (AddRecoveryEmailResponse);
  rpc VerifyRecoveryEmail(VerifyRecoveryEmailRequest) returns (VerifyRecoveryEmailResponse);

  // RequestAccountRecovery/RecoverAccount: unauthenticated — the user has no
  // session (lost access to their OAuth provider) and is proving identity
  // via the verified recovery email instead.
  rpc RequestAccountRecovery(RequestAccountRecoveryRequest) returns (RequestAccountRecoveryResponse);
  rpc RecoverAccount(RecoverAccountRequest) returns (AuthTokens);
}

enum OAuthProvider {
  OAUTH_PROVIDER_UNSPECIFIED = 0;
  OAUTH_PROVIDER_GOOGLE = 1;
  OAUTH_PROVIDER_APPLE = 2;
}

message OAuthSignInRequest {
  string id_token = 1;
  string device_id = 2;
  // Ignored. The 18+ birthday is collected right after sign-in (UserService.UpdateUser) because OAuth
  // providers don't reliably supply one, and the API refuses everything else until it's set.
  string date_of_birth = 3 [deprecated = true];
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message SignOutRequest {
  string device_id = 1;
}

message SignOutResponse {}

message AddRecoveryEmailRequest {
  string email = 1;
}

message AddRecoveryEmailResponse {}

message VerifyRecoveryEmailRequest {
  string code = 1;
}

message VerifyRecoveryEmailResponse {}

message RequestAccountRecoveryRequest {
  string recovery_email = 1;
}

message RequestAccountRecoveryResponse {}

message RecoverAccountRequest {
  string recovery_email = 1;
  string code = 2;
  OAuthProvider provider = 3;
  string id_token = 4;
  string device_id = 5;
}

message AuthTokens {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 expires_at_unix = 4;
}
