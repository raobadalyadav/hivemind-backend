syntax = "proto3";

package social.v1;

import "social/v1/common.proto";

option go_package = "github.com/hivemind/backend/gen/social/v1;socialv1";

// ConnectionService — PRD §13.9 Connections (Phase 2) + §33 example contract.
service ConnectionService {
  rpc RequestConnection(RequestConnectionRequest) returns (Connection);
  rpc RespondConnection(RespondConnectionRequest) returns (Connection);
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);

  // Meet Again (flow.md §26). Both require the caller to have attended the plan.
  rpc ListPeopleMet(ListPeopleMetRequest) returns (ListPeopleMetResponse);
  rpc CreateMeetAgainGroup(CreateMeetAgainGroupRequest) returns (CreateMeetAgainGroupResponse);
}

enum ConnectionState {
  CONNECTION_STATE_NONE = 0;
  CONNECTION_STATE_PENDING = 1;
  CONNECTION_STATE_CONNECTED = 2;
}

message PersonMet {
  string user_id = 1;
  string display_name = 2;
  string occupation = 3;
  string photo_url = 4;
  ConnectionState state = 5;
}

message ListPeopleMetRequest {
  string plan_id = 1;
}
message ListPeopleMetResponse {
  repeated PersonMet people = 1;
}

// Invitees must have attended the same plan AND already be the caller's
// accepted connections (consent). Max 5. Replays of the same
// idempotency_key return AlreadyExists.
message CreateMeetAgainGroupRequest {
  string plan_id = 1;
  repeated string invitee_ids = 2;
  string idempotency_key = 3;
}
message CreateMeetAgainGroupResponse {
  string room_id = 1;
}

enum ConnectionStatus {
  CONNECTION_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  ACCEPTED = 2;
  REJECTED = 3;
}

message Connection {
  string id = 1;
  string requester_id = 2;
  string recipient_id = 3;
  string origin_plan_id = 4; // plan that brought them together, per PRD §13.9
  ConnectionStatus status = 5;
  Audit audit = 6;
}

message RequestConnectionRequest {
  string requester_id = 1;
  string recipient_id = 2;
  string origin_plan_id = 3;
}

message RespondConnectionRequest {
  string connection_id = 1;
  bool accept = 2;
}

enum ConnectionDirection {
  CONNECTION_DIRECTION_ANY = 0;
  CONNECTION_DIRECTION_INCOMING = 1; // the caller is the recipient
  CONNECTION_DIRECTION_OUTGOING = 2; // the caller is the requester
}

message ListConnectionsRequest {
  string user_id = 1;
  PageRequest page = 2;
  ConnectionStatus status = 3;        // unspecified = any
  ConnectionDirection direction = 4;  // any = both
}

message ListConnectionsResponse {
  repeated Connection connections = 1;
  PageResponse page = 2;
}
