syntax = "proto3";

package social.v1;

import "social/v1/common.proto";

option go_package = "github.com/hivemind/backend/gen/social/v1;socialv1";

// DiscoveryService — PRD §13.3 Discovery (home feed: today/tonight/weekend/near you/for you).
service DiscoveryService {
  rpc GetHomeFeed(GetHomeFeedRequest) returns (GetHomeFeedResponse);
  rpc GetNearbyPlans(GetNearbyPlansRequest) returns (GetNearbyPlansResponse);
  // DetectCity — flow.md §2.3's "ask location permission → show nearby
  // plans": resolves a GPS point to the nearest launched city.
  rpc DetectCity(DetectCityRequest) returns (DetectCityResponse);
  // ListCategories returns plan categories with ids (CreatePlan needs a
  // category_id; the interest catalog only has names) and active cities.
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc ListCities(ListCitiesRequest) returns (ListCitiesResponse);
}

enum FeedSection {
  FEED_SECTION_UNSPECIFIED = 0;
  TODAY = 1;
  TONIGHT = 2;
  WEEKEND = 3;
  NEAR_YOU = 4;
  FOR_YOU = 5;
}

message GetHomeFeedRequest {
  string user_id = 1;
  FeedSection section = 2;
  PageRequest page = 3;
  // travel_city_id (flow.md §54 Travel Mode): optional preview of a city
  // other than the caller's home city_id. Applies to TODAY/TONIGHT/WEEKEND/
  // FOR_YOU only — NEAR_YOU stays device-location-based.
  string travel_city_id = 4;
}

message GetHomeFeedResponse {
  repeated string plan_ids = 1; // hydrated via PlanService.GetPlan
  PageResponse page = 2;
}

message GetNearbyPlansRequest {
  GeoPoint origin = 1;
  double radius_km = 2;
  PageRequest page = 3;
}

message GetNearbyPlansResponse {
  repeated string plan_ids = 1;
  PageResponse page = 2;
}

message DetectCityRequest {
  GeoPoint location = 1;
}

message DetectCityResponse {
  string city_id = 1;
  string city_name = 2;
}

message Category {
  string id = 1;
  string name = 2;
}
message ListCategoriesRequest {}
message ListCategoriesResponse {
  repeated Category categories = 1;
}

message CityInfo {
  string id = 1;
  string name = 2;
}
message ListCitiesRequest {}
message ListCitiesResponse {
  repeated CityInfo cities = 1;
}
