syntax = "proto3";

package social.v1;

import "social/v1/common.proto";

option go_package = "github.com/hivemind/backend/gen/social/v1;socialv1";

// RecommendationService — PRD §11 Intelligence and Trust at Scale (Phase 4) +
// §20's full rule-based ranking formula (0.30*distance + 0.25*interest_match
// + 0.15*time_fit + 0.10*capacity_fit + 0.10*quality + 0.10*personalization),
// computed live in SQL — no ML service, per the PRD's explicit non-goal.
service RecommendationService {
  rpc GetRecommendedPlans(GetRecommendedPlansRequest) returns (GetRecommendedPlansResponse);
  rpc GetSmartMatch(GetSmartMatchRequest) returns (GetSmartMatchResponse);
  rpc GetPeopleRecommendations(GetPeopleRecommendationsRequest) returns (GetPeopleRecommendationsResponse);
}

message GetRecommendedPlansRequest {
  string user_id = 1;
  PageRequest page = 2;
  // travel_city_id (flow.md §54 Travel Mode): optional preview of a city
  // other than the caller's home city_id — never persisted, request-scoped only.
  string travel_city_id = 3;
}

message GetRecommendedPlansResponse {
  repeated string plan_ids = 1;
  PageResponse page = 2;
}

message GetSmartMatchRequest {
  string user_id = 1;
  string plan_id = 2;
}

message GetSmartMatchResponse {
  repeated string compatible_user_ids = 1;
}

message GetPeopleRecommendationsRequest {
  PageRequest page = 1;
  string travel_city_id = 2; // see GetRecommendedPlansRequest
}

message GetPeopleRecommendationsResponse {
  repeated string user_ids = 1;
  PageResponse page = 2;
}
