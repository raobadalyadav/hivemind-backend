syntax = "proto3";

package social.v1;

import "google/protobuf/timestamp.proto";
import "social/v1/common.proto";

option go_package = "github.com/hivemind/backend/gen/social/v1;socialv1";

// PlanService — PRD §13.4 Plans + §17 example contract.
// CreatePlan/GetPlan are the fully-implemented vertical slice for this scaffold;
// SearchPlans/JoinPlan/LeavePlan/CancelPlan are typed stubs (see service.go TODOs).
service PlanService {
  rpc CreatePlan(CreatePlanRequest) returns (Plan);
  rpc GetPlan(GetPlanRequest) returns (Plan);
  rpc SearchPlans(SearchPlansRequest) returns (SearchPlansResponse);
  rpc JoinPlan(JoinPlanRequest) returns (JoinPlanResponse);
  rpc LeavePlan(LeavePlanRequest) returns (LeavePlanResponse);
  rpc CancelPlan(CancelPlanRequest) returns (Plan);
  // SuggestPlanDraft — flow.md §43 "AI Plan Creator", rule-based (no LLM
  // call, per the PRD's non-goal). Purely advisory: the host still calls
  // CreatePlan with whatever they choose.
  rpc SuggestPlanDraft(SuggestPlanDraftRequest) returns (PlanDraft);

  // Wishlist: heart a plan. Save/Unsave are idempotent; ListSavedPlans returns the
  // caller's saved plans (newest first) that they can still see.
  rpc SavePlan(SavePlanRequest) returns (SavePlanResponse);
  rpc UnsavePlan(UnsavePlanRequest) returns (UnsavePlanResponse);
  rpc ListSavedPlans(ListSavedPlansRequest) returns (ListSavedPlansResponse);

  // Plan types (flow.md §14): approval-mode join requests and invites. All
  // host-side RPCs verify request → plan → host against the caller.
  rpc RequestToJoinPlan(RequestToJoinPlanRequest) returns (PlanJoinRequest);
  rpc ListPlanJoinRequests(ListPlanJoinRequestsRequest) returns (ListPlanJoinRequestsResponse);
  rpc RespondPlanJoinRequest(RespondPlanJoinRequestRequest) returns (PlanJoinRequest);
  rpc InvitePlanUsers(InvitePlanUsersRequest) returns (InvitePlanUsersResponse);
  rpc RevokePlanInvite(RevokePlanInviteRequest) returns (RevokePlanInviteResponse);

  // Who's going (flow.md §11): privacy-filtered attendee cards, and the
  // caller's own opt-out for one plan.
  rpc GetPlanParticipants(GetPlanParticipantsRequest) returns (GetPlanParticipantsResponse);
  rpc SetParticipantVisibility(SetParticipantVisibilityRequest) returns (SetParticipantVisibilityResponse);

  // ListUpcomingPlans: discoverable plans starting in [from, to), soonest
  // first — powers "what's on next week" and the Plans discover list.
  rpc ListUpcomingPlans(ListUpcomingPlansRequest) returns (ListUpcomingPlansResponse);
}

message ListUpcomingPlansRequest {
  google.protobuf.Timestamp from = 1; // default now
  google.protobuf.Timestamp to = 2;   // default now + 30 days
  string category_id = 3;
  string city_id = 4;   // default: the caller's city
  bool free_only = 5;
  int32 limit = 6;      // default 50, max 100
}
message ListUpcomingPlansResponse {
  repeated Plan plans = 1;
}

message GetPlanParticipantsRequest {
  string plan_id = 1;
}

message ParticipantCard {
  string user_id = 1;
  string display_name = 2;
  string occupation = 3;
  repeated string interests = 4;
  string photo_url = 5;
  int32 shared_interest_count = 6;
  int32 mutual_connection_count = 7;
  int32 shared_community_count = 8;
}

message GetPlanParticipantsResponse {
  repeated ParticipantCard participants = 1; // capped at 50, caller excluded
  int32 total_attending = 2;
  // People not shown (opted out, hidden, or blocked — deliberately not
  // distinguished so a block can't be inferred).
  int32 hidden_count = 3;
  int32 connections_attending = 4; // accepted connections of the caller attending
  bool hidden_by_me = 5;           // the caller chose to hide themselves on this plan
}

message SetParticipantVisibilityRequest {
  string plan_id = 1;
  bool visible = 2;
}
message SetParticipantVisibilityResponse {}

enum PlanStatus {
  PLAN_STATUS_UNSPECIFIED = 0;
  PLAN_STATUS_DRAFT = 1;
  PLAN_STATUS_PUBLISHED = 2;
  PLAN_STATUS_FULL = 3;
  PLAN_STATUS_CANCELLED = 4;
  PLAN_STATUS_COMPLETED = 5;
}

enum PlanJoinMode {
  PLAN_JOIN_MODE_UNSPECIFIED = 0;
  PLAN_JOIN_MODE_OPEN = 1;
  PLAN_JOIN_MODE_APPROVAL = 2;
  PLAN_JOIN_MODE_INVITE_ONLY = 3;
}

enum PlanVisibility {
  PLAN_VISIBILITY_UNSPECIFIED = 0;
  PLAN_VISIBILITY_PUBLIC = 1;
  PLAN_VISIBILITY_PRIVATE = 2;
  PLAN_VISIBILITY_COMMUNITY = 3;
}

enum JoinRequestStatus {
  JOIN_REQUEST_STATUS_UNSPECIFIED = 0;
  JOIN_REQUEST_STATUS_PENDING = 1;
  JOIN_REQUEST_STATUS_APPROVED = 2;
  JOIN_REQUEST_STATUS_REJECTED = 3;
  JOIN_REQUEST_STATUS_CANCELLED = 4;
}

message Plan {
  string id = 1;
  string title = 2;
  string description = 3;
  string category_id = 4;
  string host_id = 5;
  string city_id = 6;
  string venue_id = 7;
  google.protobuf.Timestamp starts_at = 8;
  google.protobuf.Timestamp ends_at = 9;
  int32 capacity = 10;
  int32 confirmed_count = 11;
  Money price = 12;
  PlanStatus status = 13;
  GeoPoint location = 14;
  Audit audit = 15;
  PlanJoinMode join_mode = 16;
  PlanVisibility visibility = 17;
  string community_id = 18;
  string requires_entitlement = 19; // subscription product name (premium plans)
  string series_id = 20;            // set on recurring-plan occurrences
  string cover_url = 21;
  string cover_thumb_url = 22;
  // Filled on every plan read (batched, no N+1):
  bool saved_by_me = 23;
  double host_rating_avg = 24;   // average review rating over all of the host's plans (0 if none)
  int32 host_rating_count = 25;  // number of those reviews
}

message CreatePlanRequest {
  string title = 1;
  string description = 2;
  string category_id = 3;
  string host_id = 4; // IGNORED: the host is always the authenticated caller
  string city_id = 5;
  string venue_id = 6;
  google.protobuf.Timestamp starts_at = 7;
  google.protobuf.Timestamp ends_at = 8;
  int32 capacity = 9;
  Money price = 10;
  GeoPoint location = 11;
  PlanJoinMode join_mode = 12;
  PlanVisibility visibility = 13;
  string community_id = 14;         // required for community plans; caller must own/moderate it
  string requires_entitlement = 15; // must be an existing subscription product name
  // recurrence_rule: FREQ=DAILY|WEEKLY|MONTHLY[;INTERVAL=n][;COUNT=n|;UNTIL=YYYYMMDD]
  string recurrence_rule = 16;
  string cover_media_id = 17; // optional: the caller's own image upload
}

message GetPlanRequest {
  string id = 1;
}

message SearchPlansRequest {
  string city_id = 1;
  string category_id = 2;
  GeoPoint origin = 3;
  double radius_km = 4;
  PageRequest page = 5;
}

message SearchPlansResponse {
  repeated Plan plans = 1;
  PageResponse page = 2;
}

message JoinPlanRequest {
  string plan_id = 1;
  string user_id = 2;
  string idempotency_key = 3;
}

message JoinPlanResponse {
  string booking_id = 1;
}

message LeavePlanRequest {
  string plan_id = 1;
  string user_id = 2;
}

message LeavePlanResponse {}

message CancelPlanRequest {
  string plan_id = 1;
  string reason = 2;
  bool cancel_future = 3; // recurring plans: cancel this and all later occurrences
}

message SuggestPlanDraftRequest {
  string category_id = 1;
}

message PlanDraft {
  string title = 1;
  string description = 2;
}

message PlanJoinRequest {
  string id = 1;
  string plan_id = 2;
  string user_id = 3;
  JoinRequestStatus status = 4;
  string message = 5;
}

message RequestToJoinPlanRequest {
  string plan_id = 1;
  string message = 2;
}

message ListPlanJoinRequestsRequest {
  string plan_id = 1;
  JoinRequestStatus status = 2; // unspecified = all
}

message ListPlanJoinRequestsResponse {
  repeated PlanJoinRequest requests = 1;
}

message RespondPlanJoinRequestRequest {
  string request_id = 1;
  bool approve = 2;
}

message InvitePlanUsersRequest {
  string plan_id = 1;
  repeated string user_ids = 2; // max 50 per call
}

message InvitePlanUsersResponse {
  int32 invited_count = 1; // newly invited (already-invited/unknown users skipped)
}

message RevokePlanInviteRequest {
  string plan_id = 1;
  string user_id = 2;
}

message RevokePlanInviteResponse {}

message SavePlanRequest { string plan_id = 1; }
message SavePlanResponse {}
message UnsavePlanRequest { string plan_id = 1; }
message UnsavePlanResponse {}
message ListSavedPlansRequest {}
message ListSavedPlansResponse { repeated Plan plans = 1; }
