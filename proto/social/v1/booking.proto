syntax = "proto3";

package social.v1;

import "google/protobuf/timestamp.proto";
import "social/v1/common.proto";

option go_package = "github.com/hivemind/backend/gen/social/v1;socialv1";

// BookingService — PRD §13.6 Booking + §33 example contract.
// CreateBooking/GetBooking are the fully-implemented vertical slice (writes an outbox
// BOOKING_CONFIRMED event); QuoteBooking/CancelBooking/CheckIn are typed stubs.
service BookingService {
  rpc QuoteBooking(QuoteBookingRequest) returns (BookingQuote);
  rpc CreateBooking(CreateBookingRequest) returns (Booking);
  rpc GetBooking(GetBookingRequest) returns (Booking);
  rpc CancelBooking(CancelBookingRequest) returns (Booking);
  rpc CheckIn(CheckInRequest) returns (CheckInResult);

  // Waitlist (flow.md §16). Accepting an offer is just CreateBooking/JoinPlan —
  // an offered seat is held for the user until offer_expires_at.
  rpc JoinWaitlist(JoinWaitlistRequest) returns (WaitlistStatus);
  rpc LeaveWaitlist(LeaveWaitlistRequest) returns (LeaveWaitlistResponse);
  rpc GetWaitlistStatus(GetWaitlistStatusRequest) returns (WaitlistStatus);
  rpc ListMyWaitlist(ListMyWaitlistRequest) returns (ListMyWaitlistResponse);

  // My Bookings tabs (flow.md §17).
  rpc ListMyBookings(ListMyBookingsRequest) returns (ListMyBookingsResponse);

  // Digital pass (flow.md §18/§34): GetPass returns a signed payload the
  // client renders as a QR code; the host's ScanPass verifies it and checks in.
  rpc GetPass(GetPassRequest) returns (Pass);
  rpc ScanPass(ScanPassRequest) returns (ScanPassResult);
}

enum BookingStatus {
  BOOKING_STATUS_UNSPECIFIED = 0;
  BOOKING_INITIATED = 1;
  BOOKING_PAYMENT_PENDING = 2;
  BOOKING_CONFIRMED = 3;
  BOOKING_CANCELLED = 4;
  BOOKING_REFUNDED = 5;
  BOOKING_NO_SHOW = 6;
  BOOKING_ATTENDED = 7;
}

message Booking {
  string id = 1;
  string plan_id = 2;
  string user_id = 3;
  BookingStatus status = 4;
  Money price = 5;
  google.protobuf.Timestamp checked_in_at = 6;
  Audit audit = 7;
}

message QuoteBookingRequest {
  string plan_id = 1;
  string user_id = 2;
}

message BookingQuote {
  Money price = 1;
  Money service_fee = 2;
  Money total = 3;
  bool eligible = 4;
}

message CreateBookingRequest {
  string plan_id = 1;
  string user_id = 2;
  string idempotency_key = 3;
}

message GetBookingRequest {
  string id = 1;
}

message CancelBookingRequest {
  string id = 1;
  string reason = 2;
}

message CheckInRequest {
  string booking_id = 1;
  string checked_in_by = 2; // host/admin user id
}

message CheckInResult {
  Booking booking = 1;
}

enum WaitlistState {
  WAITLIST_STATE_UNSPECIFIED = 0;
  WAITLIST_STATE_NONE = 1;
  WAITLIST_STATE_WAITING = 2;
  WAITLIST_STATE_OFFERED = 3;
}

message WaitlistStatus {
  string plan_id = 1;
  WaitlistState state = 2;
  int32 position = 3; // 1-based, only while WAITING
  int32 total_waiting = 4;
  google.protobuf.Timestamp offer_expires_at = 5; // only while OFFERED
}

message JoinWaitlistRequest {
  string plan_id = 1;
}

message LeaveWaitlistRequest {
  string plan_id = 1;
}

message LeaveWaitlistResponse {}

message GetWaitlistStatusRequest {
  string plan_id = 1;
}

message ListMyWaitlistRequest {}

message ListMyWaitlistResponse {
  repeated WaitlistStatus entries = 1;
}

enum BookingTab {
  BOOKING_TAB_UNSPECIFIED = 0;
  BOOKING_TAB_UPCOMING = 1;
  BOOKING_TAB_PAST = 2;
  BOOKING_TAB_CANCELLED = 3;
}

message BookingSummary {
  Booking booking = 1;
  string plan_title = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  bool reviewed = 5; // the caller already rated this booking
}

message ListMyBookingsRequest {
  BookingTab tab = 1;
}

message ListMyBookingsResponse {
  repeated BookingSummary bookings = 1;
}

message GetPassRequest {
  string booking_id = 1;
}

message Pass {
  string booking_id = 1;
  string plan_id = 2;
  string plan_title = 3;
  string plan_description = 4;
  string venue_name = 5;
  string venue_address = 6;
  google.protobuf.Timestamp starts_at = 7;
  google.protobuf.Timestamp ends_at = 8;
  string host_name = 9;
  string payload = 10; // signed; render as QR
  google.protobuf.Timestamp valid_until = 11;
  BookingStatus status = 12;
}

message ScanPassRequest {
  string payload = 1;
}

message ScanPassResult {
  Booking booking = 1;
  string attendee_name = 2;
}
