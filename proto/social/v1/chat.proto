syntax = "proto3";

package social.v1;

import "google/protobuf/timestamp.proto";
import "social/v1/common.proto";

option go_package = "github.com/hivemind/backend/gen/social/v1;socialv1";

// ChatService — PRD §13.7 Chat. Transactional membership/history goes through this
// gRPC service; live delivery uses the separate WebSocket gateway described in PRD §16
// (not part of this proto — the gateway reads persisted messages via this service).
service ChatService {
  rpc CreateRoom(CreateRoomRequest) returns (ChatRoom);
  rpc SendMessage(SendMessageRequest) returns (Message);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc ReportMessage(ReportMessageRequest) returns (ReportMessageResponse);
  // GenerateIcebreaker — flow.md §42 "AI Icebreaker", rule-based shared-
  // interest suggestion (no LLM call, per the PRD's non-goal).
  rpc GenerateIcebreaker(GenerateIcebreakerRequest) returns (GenerateIcebreakerResponse);

  // Rich chat (flow.md §19). Every RPC checks room membership; announcements
  // and pins are limited to the plan's host (or an admin).
  rpc CreatePoll(CreatePollRequest) returns (Message);
  rpc VotePoll(VotePollRequest) returns (Poll);
  rpc PinMessage(PinMessageRequest) returns (PinMessageResponse);

  // Inbox: the caller's chats, split Primary / General, with unread counts.
  rpc ListMyChats(ListMyChatsRequest) returns (ListMyChatsResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  // OpenDirectChat opens (or returns) the 1:1 chat with an accepted connection.
  rpc OpenDirectChat(OpenDirectChatRequest) returns (ChatRoom);
}

enum ChatTab {
  CHAT_TAB_PRIMARY = 0; // friends' DMs + chats of upcoming plans you're in
  CHAT_TAB_GENERAL = 1; // everything else: event groups, meet-again groups, past plans
  CHAT_TAB_ALL = 2;    // every chat
  CHAT_TAB_GROUPS = 3; // plan / event / group chats (not DMs)
}

enum ChatKind {
  CHAT_KIND_GROUP = 0;
  CHAT_KIND_PLAN = 1;
  CHAT_KIND_DM = 2;
}

message ChatSummary {
  string room_id = 1;
  ChatKind kind = 2;
  string title = 3;         // person's name (DM) or plan title
  string other_user_id = 4; // DM only
  string plan_id = 5;       // plan chats only
  string avatar_url = 6;    // DM: their main photo
  bool other_verified = 7;  // DM: blue tick
  string last_message = 8;  // preview ("📷 Photo" for media)
  google.protobuf.Timestamp last_message_at = 9;
  int32 unread_count = 10;
  bool muted = 11;
}

message ListMyChatsRequest {
  ChatTab tab = 1;
}
message ListMyChatsResponse {
  repeated ChatSummary chats = 1;
  int32 primary_unread = 2; // totals across both tabs, for the bar badge and tab dots
  int32 general_unread = 3;
  int32 groups_unread = 4;
}

message MarkReadRequest { string room_id = 1; }
message MarkReadResponse {}

message OpenDirectChatRequest { string user_id = 1; }

enum MessageType {
  MESSAGE_TYPE_TEXT = 0;
  MESSAGE_TYPE_IMAGE = 1;
  MESSAGE_TYPE_VOICE = 2;
  MESSAGE_TYPE_POLL = 3;
  MESSAGE_TYPE_ANNOUNCEMENT = 4;
  MESSAGE_TYPE_LOCATION = 5;
}

message Location {
  double latitude = 1;
  double longitude = 2;
  string label = 3;
}

message PollOption {
  string id = 1;
  string label = 2;
  int32 vote_count = 3;
}

message Poll {
  string id = 1;
  string question = 2;
  repeated PollOption options = 3;
  string my_vote_option_id = 4; // "" = not voted
  int32 total_votes = 5;
}

message ChatRoom {
  string id = 1;
  string plan_id = 2;
  Audit audit = 3;
  string pinned_message_id = 4;
}

message Message {
  string id = 1;
  string room_id = 2;
  string sender_id = 3;
  string body = 4;
  google.protobuf.Timestamp sent_at = 5;
  MessageType type = 6;
  repeated string media_urls = 7;
  Location location = 8;
  int32 duration_seconds = 9; // voice
  Poll poll = 10;
  repeated MediaAsset media = 11; // image messages: photos and/or videos
}

message CreateRoomRequest {
  string plan_id = 1;
}

// sender_id is ignored — the sender is always the authenticated caller.
// text/announcement need body; image needs 1–10 https media_urls (body is the
// caption); voice needs exactly 1 media_url + duration_seconds 1–300;
// location needs a valid location.
message SendMessageRequest {
  string room_id = 1;
  string sender_id = 2;
  string body = 3;
  MessageType type = 4;
  repeated string media_urls = 5 [deprecated = true]; // ignored: upload and send media_ids
  Location location = 6;
  int32 duration_seconds = 7;
  repeated string media_ids = 8; // IMAGE messages: 1–10 of the caller's own uploads (photo or video)
}

message CreatePollRequest {
  string room_id = 1;
  string question = 2;
  repeated string options = 3; // 2–6
}

message VotePollRequest {
  string poll_id = 1;
  string option_id = 2;
}

message PinMessageRequest {
  string room_id = 1;
  string message_id = 2;
  bool unpin = 3;
}

message PinMessageResponse {
  string pinned_message_id = 1; // "" after unpin
}

message ListMessagesRequest {
  string room_id = 1;
  PageRequest page = 2;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  PageResponse page = 2;
  Message pinned_message = 3;
}

message ReportMessageRequest {
  string message_id = 1;
  string reporter_id = 2;
  string reason = 3;
}

message ReportMessageResponse {
  string moderation_case_id = 1;
}

message GenerateIcebreakerRequest {
  string room_id = 1;
}

message GenerateIcebreakerResponse {
  string text = 1;
}
