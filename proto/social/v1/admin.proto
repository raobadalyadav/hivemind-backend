syntax = "proto3";

package social.v1;

import "google/protobuf/timestamp.proto";
import "social/v1/common.proto";
import "social/v1/external_event.proto";

option go_package = "github.com/hivemind/backend/gen/social/v1;socialv1";

// AdminService — PRD §13.18 Admin & Analytics + §23 Admin and Operations Platform.
// Every mutating RPC here is expected to be behind RBAC (pkg/grpcmiddleware) and
// produce an audit_logs row, per PRD §31 Definition of Done.
service AdminService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc SuspendUser(SuspendUserRequest) returns (SuspendUserResponse);
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse);
  rpc OverrideBookingStatus(OverrideBookingStatusRequest) returns (OverrideBookingStatusResponse);
  rpc GetDashboardStats(GetDashboardStatsRequest) returns (GetDashboardStatsResponse);

  // Phase 3 Marketplace admin actions — same RBAC + audit_logs discipline as
  // SuspendUser/OverrideBookingStatus above.
  rpc ApproveHost(ApproveHostRequest) returns (ApproveHostResponse);
  rpc MarkPayoutProcessed(MarkPayoutProcessedRequest) returns (MarkPayoutProcessedResponse);
  rpc AdminGrantCredit(AdminGrantCreditRequest) returns (AdminGrantCreditResponse);
  rpc CreateCoupon(CreateCouponRequest) returns (Coupon);
  rpc ListCoupons(ListCouponsRequest) returns (ListCouponsResponse);
  rpc DeactivateCoupon(DeactivateCouponRequest) returns (DeactivateCouponResponse);

  // Phase 5 city launch workflow (flow.md §55).
  // Safety (flow.md §45) and external events (flow.md §29) — admin only,
  // audited, and listed in adminMethods.
  rpc ListSOSEvents(ListSOSEventsRequest) returns (ListSOSEventsResponse);
  rpc AcknowledgeSOSEvent(AcknowledgeSOSEventRequest) returns (AcknowledgeSOSEventResponse);
  rpc CreateExternalEvent(CreateExternalEventRequest) returns (ExternalEvent);
  rpc DeactivateExternalEvent(DeactivateExternalEventRequest) returns (DeactivateExternalEventResponse);

  rpc CreateCity(CreateCityRequest) returns (City);
  rpc UpdateCityStatus(UpdateCityStatusRequest) returns (UpdateCityStatusResponse);
}

message ListUsersRequest {
  string query = 1;
  PageRequest page = 2;
}

message ListUsersResponse {
  repeated string user_ids = 1;
  PageResponse page = 2;
}

message SuspendUserRequest {
  string user_id = 1;
  string reason = 2;
  string actor_id = 3; // admin performing the action, for the audit log
}

message SuspendUserResponse {}

message ListReportsRequest {
  string status = 1;
  PageRequest page = 2;
}

message ListReportsResponse {
  repeated string case_ids = 1;
  PageResponse page = 2;
}

message OverrideBookingStatusRequest {
  string booking_id = 1;
  string new_status = 2;
  string reason = 3;
  string actor_id = 4;
}

message OverrideBookingStatusResponse {}

message GetDashboardStatsRequest {
  string city_id = 1;
}

message GetDashboardStatsResponse {
  int64 dau = 1;
  int64 mau = 2;
  int64 bookings_today = 3;
  int64 gmv_minor_units = 4;
}

message ApproveHostRequest {
  string user_id = 1;
}

message ApproveHostResponse {}

message MarkPayoutProcessedRequest {
  string payout_id = 1;
}

message MarkPayoutProcessedResponse {}

message AdminGrantCreditRequest {
  string user_id = 1;
  int64 amount_minor = 2;
  string reason = 3;
}

message AdminGrantCreditResponse {}

message CreateCouponRequest {
  string code = 1;
  string discount_type = 2; // percent | fixed
  int64 discount_value = 3;
  int32 max_uses = 4; // 0 = unlimited
  google.protobuf.Timestamp expires_at = 5;
}

message Coupon {
  string id = 1;
  string code = 2;
  string discount_type = 3;
  int64 discount_value = 4;
  int32 max_uses = 5;
  int32 uses_count = 6;
  bool active = 7;
}

message ListCouponsRequest {
  PageRequest page = 1;
}

message ListCouponsResponse {
  repeated Coupon coupons = 1;
  PageResponse page = 2;
}

message DeactivateCouponRequest {
  string id = 1;
}

message DeactivateCouponResponse {}

message City {
  string id = 1;
  string name = 2;
  string state = 3;
  string country = 4;
  string status = 5; // pre_launch | soft_launch | active | scaling | mature
}

message CreateCityRequest {
  string name = 1;
  string state = 2;
  string country = 3; // ISO-2, defaults to 'IN' if empty
}

message UpdateCityStatusRequest {
  string city_id = 1;
  string status = 2;
}

message UpdateCityStatusResponse {}

message SOSEvent {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string plan_id = 4;
  double latitude = 5;
  double longitude = 6;
  bool has_location = 7;
  string note = 8;
  string contact_delivery = 9; // sent | failed | no_contact
  string delivery_error = 10;
  bool acknowledged = 11;
  google.protobuf.Timestamp created_at = 12;
}
message ListSOSEventsRequest {
  bool only_unacknowledged = 1;
  int32 limit = 2;
}
message ListSOSEventsResponse {
  repeated SOSEvent events = 1;
}
message AcknowledgeSOSEventRequest {
  string sos_id = 1;
}
message AcknowledgeSOSEventResponse {}

message CreateExternalEventRequest {
  string city_id = 1;
  string category_id = 2;
  string title = 3;
  string description = 4;
  string source = 5;
  string source_url = 6; // http(s)
  string venue_name = 7;
  string image_url = 8;
  google.protobuf.Timestamp starts_at = 9;
  google.protobuf.Timestamp ends_at = 10;
}
message DeactivateExternalEventRequest {
  string event_id = 1;
}
message DeactivateExternalEventResponse {}
